# ============================================================
#  Konfigurasi Ubuntu -> macOS
#  Ubah nilai di sini, lalu jalankan: ./install.sh
# ============================================================

# Gaya tema:
#   tahoe  = MacTahoe (paling mirip screenshot referensi.png)
#   bigsur = WhiteSur (gaya macOS Big Sur klasik)
THEME_FAMILY="tahoe"

# Mode terang / gelap
#   light | dark
THEME_MODE="light"

# Warna aksen tema GTK/Shell
#   default | blue | purple | pink | red | orange | yellow | green | grey
GTK_ACCENT="grey"

# Warna aksen ikon
#   default | blue | purple | pink | red | orange | yellow | green | grey
# Catatan:
#   - MacTahoe: "blue" sama dengan ikon MacTahoe bawaan (seperti referensi).
#   - WhiteSur tidak punya aksen blue; otomatis memakai default.
#   - MacTahoe tidak punya aksen pink; otomatis memakai purple.
ICON_ACCENT="blue"

# ------------------------------------------------------------
# Dock
# ------------------------------------------------------------
# Ukuran ikon dock dalam piksel.
# Catatan: screenshot referensi memakai ikon 56 px dan opasitas 22%.
# Kalau memang ingin ikon kecil 22 px, ubah nilai ini menjadi 22.
DOCK_ICON_SIZE=56

# Opasitas latar dock (0.0 - 1.0). 0.22 = 22% seperti referensi.
DOCK_BG_OPACITY=0.22

# Warna latar dock
DOCK_BG_COLOR="#eeeeec"

# Posisi dock: BOTTOM | LEFT | RIGHT
DOCK_POSITION="BOTTOM"

# Sembunyikan dock otomatis (true/false)
DOCK_AUTOHIDE="true"

# Sembunyikan dock saat ada jendela (true/false)
DOCK_INTELLIHIDE="true"

# Tampilkan tombol "Show Applications" (grid 9 titik) di dock.
# Ini padanan tombol Start Windows / Launchpad macOS.
#   1 = tampil (default, supaya menu semua aplikasi gampang dibuka)
#   0 = sembunyikan (ala macOS asli; app grid tetap bisa dibuka dengan Super+A)
SHOW_APPS_BUTTON=1

# ------------------------------------------------------------
# Wallpaper
# ------------------------------------------------------------
# Pilihan:
#   tahoe-night | tahoe-day | bigsur | bigsur-dark
#   ventura-dark | ventura-light | custom
WALLPAPER_PRESET="tahoe-night"

# Kalau WALLPAPER_PRESET="custom", isi path file gambar di sini.
WALLPAPER_FILE=""

# ------------------------------------------------------------
# Fitur lain
# ------------------------------------------------------------
# Sembunyikan menu bar atas otomatis (1 = ya, 0 = tidak).
# macOS asli menampilkan menu bar terus; biarkan 0 agar mirip macOS.
HIDE_TOP_BAR=0

# Terapkan tema GTK4/libadwaita (disarankan untuk Ubuntu 22.04+)
INSTALL_LIBADWAITA_THEME=1

# Buat profil terminal GNOME Terminal bergaya macOS
INSTALL_TERMINAL_PROFILE=1

# Terapkan shortcut keyboard ala macOS
APPLY_MACOS_KEYBINDINGS=1

# Aktifkan ekstensi GNOME yang dibutuhkan
ENABLE_EXTENSIONS=1

# Atur preferensi Nautilus/Files
SET_NAUTILUS_PREFS=1

# Sembunyikan ikon Home/Trash di desktop
SET_DESKTOP_ICONS=1
